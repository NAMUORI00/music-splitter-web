spring:
  datasource:
    :driverClassName: org.mariadb.jdbc.Driver
    :url: ${DB_URL:jdbc:mariadb://localhost:3306/music_splitter}
    :username: ${DB_USERNAME:music_splitter}
    :password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8081